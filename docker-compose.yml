services:
  postgres:
    image: postgres:16
    container_name: desales-accounting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastplus
      POSTGRES_PASSWORD: fastplus
      POSTGRES_DB: fastplus
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastplus -d fastplus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
